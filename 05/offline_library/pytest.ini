[pytest]
# Пути для поиска тестов
testpaths = tests

# Параметры для pytest-cov
addopts = 
    --cov=src/app
    --cov-report=html
    --cov-report=term
    --cov-report=term-missing
    -v

# Настройки для pytest-asyncio
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Маркеры для группировки тестов
markers =
    create: Тесты для операций создания (POST)
    read: Тесты для операций чтения (GET)
    update: Тесты для операций обновления (PUT)
    delete: Тесты для операций удаления (DELETE)
    authors: Тесты для авторов
    books: Тесты для книг
    clients: Тесты для клиентов
    orders: Тесты для заказов
    validation: Тесты валидации
    integration: Интеграционные тесты
    unit: Юнит-тесты